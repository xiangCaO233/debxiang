name: Maintain Debian packages
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: debxiang-publish
  cancel-in-progress: false
jobs:
  packages:
    runs-on: [self-hosted, Linux, X64, debxiang]
    outputs:
      failures_count: ${{ steps.maintain.outputs.failures_count }}
      changed: ${{ steps.maintain.outputs.changed }}
      manifest_sha256: ${{ steps.maintain.outputs.manifest_sha256 }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      DEBXIANG_STATE: /home/xiang/.local/state/debxiang
    steps:
      - uses: actions/checkout@v6
      - name: Verify scripts
        run: python3 -m unittest discover -s tests -v
      - name: Check upstream, build and sign repository
        id: maintain
        run: |
          set -euo pipefail
          python3 scripts/maintain.py --state "$DEBXIANG_STATE" --site "$RUNNER_TEMP/debxiang-site"
      - name: Publish package downloads
        if: steps.maintain.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/publish.py --site "$RUNNER_TEMP/debxiang-site"
      - uses: actions/configure-pages@v5
        if: steps.maintain.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.maintain.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/debxiang-site
  deploy:
    needs: packages
    if: needs.packages.outputs.changed == 'true'
    runs-on: [self-hosted, Linux, X64, debxiang]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed APT repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remember successfully deployed package manifest
        run: |
          printf '%s\n' '${{ needs.packages.outputs.manifest_sha256 }}' > /home/xiang/.local/state/debxiang/deployed-manifest.sha256.tmp
          mv /home/xiang/.local/state/debxiang/deployed-manifest.sha256.tmp /home/xiang/.local/state/debxiang/deployed-manifest.sha256
      - name: Report failed components after publishing verified updates
        if: needs.packages.outputs.failures_count != '0'
        run: |
          echo 'Some upstream packages failed. Verified updates were published; failed packages keep their previous version. See the packages job log.'
          exit 1
